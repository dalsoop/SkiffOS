name: Korean core image

on:
  push:
    branches:
      - agent/korean-desktop
    paths:
      - configs/skiff/core/buildroot_ext/package/skiff-core-defconfig/coreenv/Dockerfile
      - .github/workflows/korean-core-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: "{{defaultContext}}:configs/skiff/core/buildroot_ext/package/skiff-core-defconfig/coreenv"
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/skiffos-korean:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
